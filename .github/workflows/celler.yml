name: Cache custom Nix packages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/celler.yml
      - flake.lock
      - flake.nix
      - packages/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and cache packages
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Load Nix cache configuration
        run: |
          cache_config="$(
            nix eval \
              --json \
              --impure \
              --expr '
                let
                  settings =
                    (builtins.getFlake (toString ./.)).nixosConfigurations.loki.config.nix.settings;
                in
                {
                  inherit (settings) substituters;
                  trustedPublicKeys = settings."trusted-public-keys";
                }
              '
          )"

          substituters="$(jq -r '.substituters | join(" ")' <<< "$cache_config")"
          public_keys="$(jq -r '.trustedPublicKeys | join(" ")' <<< "$cache_config")"

          {
            echo 'NIX_CONFIG<<EOF'
            echo "substituters = $substituters"
            echo "trusted-public-keys = $public_keys"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify cache connectivity
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            https://cache.jervw.dev/nix/nix-cache-info

      - name: Install Celler client
        run: |
          celler_path="$(
            nix build \
              --no-link \
              --print-out-paths \
              --impure \
              --expr '
                let
                  flake = builtins.getFlake (toString ./.);
                  system = "x86_64-linux";
                in
                flake.inputs.celler.packages.${system}.celler
              '
          )"
          echo "$celler_path/bin" >> "$GITHUB_PATH"
          echo "CELLER_PATH=$celler_path" >> "$GITHUB_ENV"

      - name: Log in to Celler
        env:
          CELLER_TOKEN: ${{ secrets.CELLER_TOKEN }}
        run: celler login --set-default ci https://cache.jervw.dev/

      - name: Push Celler client
        run: celler push nix "$CELLER_PATH"

      - name: Build and push cache targets
        run: |
          build_and_push() {
            local name="$1"
            shift

            echo "::group::Build and push $name"
            paths="$(nix build --no-link --print-out-paths "$@")"

            while IFS= read -r path; do
              celler push nix "$path"
            done <<< "$paths"
            echo "::endgroup::"
          }

          build_and_push librepods-omarchy .#librepods-omarchy
          build_and_push nixpkgs-webhook .#nixpkgs-webhook
          build_and_push wl-ocr .#wl-ocr

          build_and_push agenix \
            --impure \
            --expr '
              let
                flake = builtins.getFlake (toString ./.);
                system = "x86_64-linux";
              in
              flake.inputs.agenix.packages.${system}.default
            '

          build_and_push helix \
            --impure \
            --expr '
              let
                flake = builtins.getFlake (toString ./.);
                system = "x86_64-linux";
              in
              flake.inputs.helix.packages.${system}.default
            '
